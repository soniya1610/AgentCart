<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - AgentCart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- Navbar (loaded from common.js) -->
    <nav id="navbar"></nav>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <main>
        <section class="cart-section">
            <div class="container">
                <h1>Shopping Cart</h1>

                <!-- Cart Items -->
                <div id="cartContent" class="cart-content" style="display: none;">
                    <div class="cart-items-section">
                        <div id="cartItems" class="cart-items"></div>
                    </div>

                    <div class="cart-summary-section">
                        <div class="cart-summary">
                            <h2>Order Summary</h2>
                            
                            <div class="summary-row">
                                <span>Subtotal</span>
                                <span id="subtotalAmount">₹0</span>
                            </div>
                            <div class="summary-row">
                                <span>Shipping</span>
                                <span id="shippingAmount">₹0</span>
                            </div>
                            <div class="summary-row">
                                <span>Tax</span>
                                <span id="taxAmount">₹0</span>
                            </div>
                            
                            <div class="summary-divider"></div>
                            
                            <div class="summary-row total">
                                <span>Total</span>
                                <span id="totalAmount">₹0</span>
                            </div>

                            <button class="btn btn-primary btn-block" onclick="proceedToCheckout()">
                                Proceed to Checkout
                            </button>
                            <a href="products.html" class="btn btn-secondary btn-block">
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Empty Cart State -->
                <div id="emptyCart" class="empty-state" style="display: none;">
                    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="100" cy="80" r="30" opacity="0.2"/>
                        <path d="M 70 120 L 130 120 L 125 150 Q 100 160 75 150 Z" opacity="0.2"/>
                    </svg>
                    <h2>Your Cart is Empty</h2>
                    <p>Add some products to get started</p>
                    <a href="products.html" class="btn btn-primary">
                        Explore Products
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AgentCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            
            if (!isLoggedIn()) {
                showToast('Please login to view cart', 'warning');
                setTimeout(() => navigateTo('login.html'), 1000);
                return;
            }

            displayCart();
        });

        function displayCart() {
            const cart = getCart();

            if (cart.length === 0) {
                document.getElementById('emptyCart').style.display = 'flex';
                document.getElementById('cartContent').style.display = 'none';
                return;
            }

            document.getElementById('cartContent').style.display = 'grid';
            document.getElementById('emptyCart').style.display = 'none';

            const cartItemsContainer = document.getElementById('cartItems');
            cartItemsContainer.innerHTML = '';

            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-image">
                        <div class="product-placeholder">
                            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1">
                                <rect x="10" y="20" width="80" height="60" rx="4"/>
                            </svg>
                        </div>
                    </div>
                    <div class="cart-item-details">
                        <h3>Product #${item.id}</h3>
                        <p class="price">₹${item.price.toLocaleString()}</p>
                    </div>
                    <div class="cart-item-quantity">
                        <button onclick="updateQuantity(${index}, ${item.quantity - 1})">−</button>
                        <input type="number" value="${item.quantity}" readonly>
                        <button onclick="updateQuantity(${index}, ${item.quantity + 1})">+</button>
                    </div>
                    <div class="cart-item-total">
                        ₹${itemTotal.toLocaleString()}
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart(${index})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                `;
                cartItemsContainer.appendChild(cartItem);
            });

            updateOrderSummary(subtotal);
        }

        function updateQuantity(index, newQuantity) {
            const cart = getCart();
            if (newQuantity <= 0) {
                removeFromCart(index);
                return;
            }
            cart[index].quantity = newQuantity;
            saveCart(cart);
            displayCart();
            showToast('Cart updated', 'success');
        }

        function removeFromCart(index) {
            const cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
            displayCart();
            showToast('Item removed from cart', 'success');
        }

        function updateOrderSummary(subtotal) {
            const shipping = subtotal > 500 ? 0 : 50;
            const tax = Math.round(subtotal * 0.12); // 12% tax
            const total = subtotal + shipping + tax;

            document.getElementById('subtotalAmount').textContent = `₹${subtotal.toLocaleString()}`;
            document.getElementById('shippingAmount').textContent = shipping === 0 ? 'Free' : `₹${shipping}`;
            document.getElementById('taxAmount').textContent = `₹${tax}`;
            document.getElementById('totalAmount').textContent = `₹${total.toLocaleString()}`;

            // Store order total for checkout
            sessionStorage.setItem('orderTotal', total);
            sessionStorage.setItem('orderSubtotal', subtotal);
        }

        function proceedToCheckout() {
            if (!isLoggedIn()) {
                showToast('Please login to checkout', 'warning');
                setTimeout(() => navigateTo('login.html'), 1000);
                return;
            }

            navigateTo('checkout.html');
        }

        function getCart() {
            const cart = localStorage.getItem('cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = totalItems;
                badge.style.display = totalItems > 0 ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
