<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - AgentCart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/products.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- Navbar (loaded from common.js) -->
    <nav id="navbar"></nav>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <main>
        <section class="products-section">
            <div class="container">
                <div class="products-header">
                    <h1>Discover Products</h1>
                    <p>Browse our curated marketplace and find exactly what you're looking for</p>
                </div>

                <!-- Filters and Search -->
                <div class="products-controls">
                    <div class="search-bar">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="Search products..."
                            class="search-input"
                        >
                        <button class="btn-icon-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="filter-controls">
                        <select id="categoryFilter" class="filter-select">
                            <option value="">All Categories</option>
                        </select>
                        <select id="sortFilter" class="filter-select">
                            <option value="newest">Newest</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                        </select>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="loading-state" style="display: none;">
                    <div class="skeleton-grid">
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>

                <!-- Products Grid -->
                <div id="productsGrid" class="products-grid"></div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="100" cy="100" r="80" opacity="0.2"/>
                        <path d="M 100 60 Q 130 80 130 110 Q 130 140 100 150 Q 70 140 70 110 Q 70 80 100 60" opacity="0.3"/>
                    </svg>
                    <h2>No Products Found</h2>
                    <p id="emptyStateMessage">Try adjusting your search or filters</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AgentCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/products.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            
            // Initialize products page
            initProductsPage();

            // Setup event listeners
            document.getElementById('searchInput').addEventListener('input', handleSearchChange);
            document.getElementById('categoryFilter').addEventListener('change', handleFilterChange);
            document.getElementById('sortFilter').addEventListener('change', handleSortChange);
        });

        async function initProductsPage() {
            try {
                showLoadingState();
                await loadProducts();
                hideLoadingState();
            } catch (error) {
                console.error('Error initializing products:', error);
                hideLoadingState();
                showEmptyState('Failed to load products');
                showToast('Failed to load products', 'error');
            }
        }

        function handleSearchChange() {
            filterAndDisplayProducts();
        }

        function handleFilterChange() {
            filterAndDisplayProducts();
        }

        function handleSortChange() {
            sortAndDisplayProducts();
        }

        function showLoadingState() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('productsGrid').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
        }

        function hideLoadingState() {
            document.getElementById('loadingState').style.display = 'none';
        }

        function showEmptyState(message = 'No products found') {
            document.getElementById('emptyStateMessage').textContent = message;
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('productsGrid').style.display = 'none';
        }

        function showProducts() {
            document.getElementById('productsGrid').style.display = 'grid';
            document.getElementById('emptyState').style.display = 'none';
        }
    </script>
</body>
</html>
