<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - AgentCart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- Navbar (loaded from common.js) -->
    <nav id="navbar"></nav>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <main>
        <section class="orders-section">
            <div class="container">
                <div class="section-header">
                    <h1>Your Orders</h1>
                    <p>Track and manage all your purchases</p>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="loading-state" style="display: none;">
                    <div class="skeleton-list">
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                        <div class="skeleton-item"></div>
                    </div>
                </div>

                <!-- Orders List -->
                <div id="ordersContainer" style="display: none;">
                    <div id="ordersList" class="orders-list"></div>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="100" cy="100" r="80" opacity="0.2"/>
                        <path d="M 70 100 Q 100 80 130 100 Q 100 120 70 100" opacity="0.3"/>
                    </svg>
                    <h2>No Orders Yet</h2>
                    <p>You haven't placed any orders yet</p>
                    <a href="products.html" class="btn btn-primary">
                        Start Shopping
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AgentCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            
            if (!isLoggedIn()) {
                showToast('Please login to view orders', 'warning');
                setTimeout(() => navigateTo('login.html'), 1000);
                return;
            }

            loadOrders();
        });

        async function loadOrders() {
            try {
                showLoadingState();

                // ADJUST ACCORDING TO ACTUAL BACKEND ENDPOINT
                const orders = await apiRequest('/api/orders/my-orders');

                // ADJUST ACCORDING TO ACTUAL BACKEND RESPONSE
                // Expected response: Array of orders
                // Example structure: [
                //   { id, date, status, totalAmount, items: [...] },
                //   ...
                // ]

                if (orders && orders.length > 0) {
                    displayOrders(orders);
                    showOrdersList();
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                showEmptyState();
                showToast('Failed to load orders', 'error');
            } finally {
                hideLoadingState();
            }
        }

        function displayOrders(orders) {
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';

            orders.forEach(order => {
                // ADJUST FIELD NAMES ACCORDING TO ACTUAL BACKEND RESPONSE
                const {
                    id = '',
                    orderDate = new Date().toISOString(),
                    status = 'Pending',
                    totalAmount = 0,
                    items = []
                } = order;

                const orderDate_obj = new Date(orderDate);
                const formattedDate = orderDate_obj.toLocaleDateString('en-IN', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                const orderCard = document.createElement('div');
                orderCard.className = 'order-card';
                
                let itemsHtml = '';
                if (items && items.length > 0) {
                    const itemCount = items.length;
                    itemsHtml = `<span class="order-items-count">${itemCount} item${itemCount !== 1 ? 's' : ''}</span>`;
                }

                orderCard.innerHTML = `
                    <div class="order-header">
                        <div class="order-id">
                            <h3>Order #${escapeHtml(id)}</h3>
                            <p class="order-date">${formattedDate}</p>
                        </div>
                        <div class="order-status">
                            <span class="status-badge ${getStatusClass(status)}">
                                ${escapeHtml(status)}
                            </span>
                        </div>
                    </div>

                    <div class="order-details">
                        ${itemsHtml}
                        <span class="order-amount">₹${totalAmount.toLocaleString()}</span>
                    </div>

                    <div class="order-actions">
                        <button class="btn btn-secondary btn-sm" onclick="viewOrderDetails('${id}')">
                            View Details
                        </button>
                    </div>
                `;

                ordersList.appendChild(orderCard);
            });
        }

        function getStatusClass(status) {
            const statusMap = {
                'pending': 'status-pending',
                'approved': 'status-approved',
                'paid': 'status-paid',
                'processing': 'status-processing',
                'completed': 'status-completed',
                'cancelled': 'status-cancelled'
            };
            return statusMap[status.toLowerCase()] || 'status-pending';
        }

        function viewOrderDetails(orderId) {
            // Can be extended to show detailed view
            showToast(`Opening details for order #${orderId}`, 'info');
        }

        function showLoadingState() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('ordersContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
        }

        function hideLoadingState() {
            document.getElementById('loadingState').style.display = 'none';
        }

        function showOrdersList() {
            document.getElementById('ordersContainer').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
        }

        function showEmptyState() {
            document.getElementById('emptyState').style.display = 'flex';
            document.getElementById('ordersContainer').style.display = 'none';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
