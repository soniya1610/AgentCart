<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negotiation - AgentCart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
    <!-- Navbar (loaded from common.js) -->
    <nav id="navbar"></nav>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <main>
        <section class="negotiation-section">
            <div class="container">
                <a href="products.html" class="back-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Back
                </a>

                <div class="negotiation-container">
                    <!-- Product Info Panel -->
                    <div class="negotiation-product-panel">
                        <h2>Negotiation Details</h2>
                        <div class="negotiation-product-info">
                            <div class="product-info-item">
                                <span class="label">Product</span>
                                <span id="productName" class="value">Loading...</span>
                            </div>
                            <div class="product-info-item">
                                <span class="label">Original Price</span>
                                <span id="originalPrice" class="value">₹0</span>
                            </div>
                            <div class="product-info-item">
                                <span class="label">Current Negotiated Price</span>
                                <span id="currentPrice" class="value">₹0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Negotiation Workspace -->
                    <div class="negotiation-workspace">
                        <h2>Start Negotiating</h2>

                        <!-- Negotiation Status -->
                        <div id="negotiationStatus" class="negotiation-status" style="display: none;">
                            <div class="status-card">
                                <h3>Negotiation Status</h3>
                                <div class="status-info">
                                    <span id="statusBadge" class="status-badge">Active</span>
                                    <p id="statusMessage">Waiting for seller response...</p>
                                </div>
                            </div>
                        </div>

                        <!-- Proposed Price Form -->
                        <div id="priceProposalForm" class="price-proposal-form">
                            <div class="form-group">
                                <label for="proposedPrice">Your Proposed Price</label>
                                <div class="price-input-group">
                                    <span class="currency">₹</span>
                                    <input 
                                        type="number" 
                                        id="proposedPrice" 
                                        placeholder="Enter your proposed price"
                                        min="0"
                                        max="999999"
                                    >
                                </div>
                                <small id="priceInfo"></small>
                            </div>

                            <div class="form-group">
                                <label for="message">Message to Seller</label>
                                <textarea 
                                    id="message" 
                                    placeholder="Add a message (optional)"
                                    rows="4"
                                ></textarea>
                            </div>

                            <button class="btn btn-primary btn-block" onclick="submitProposal()">
                                Submit Proposal
                            </button>
                        </div>

                        <!-- Negotiation Messages -->
                        <div id="negotiationThread" class="negotiation-thread" style="display: none;">
                            <h3>Negotiation Thread</h3>
                            <div id="messagesList" class="messages-list"></div>
                        </div>

                        <!-- Action Buttons -->
                        <div id="actionButtons" class="negotiation-actions" style="display: none;">
                            <button class="btn btn-primary" onclick="acceptOffer()">
                                Accept Offer
                            </button>
                            <button class="btn btn-secondary" onclick="continueNegotiating()">
                                Make Another Offer
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 AgentCart. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/negotiation.js"></script>
    <script>
        let currentNegotiationId = null;
        let productId = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar();
            
            if (!isLoggedIn()) {
                showToast('Please login to negotiate', 'warning');
                setTimeout(() => navigateTo('login.html'), 1000);
                return;
            }

            initNegotiation();
        });

        function initNegotiation() {
            // Get product info from sessionStorage (set from product details page)
            productId = sessionStorage.getItem('negotiationProductId');
            const productName = sessionStorage.getItem('negotiationProductName');
            const originalPrice = sessionStorage.getItem('negotiationOriginalPrice');

            if (!productId) {
                showToast('No product selected for negotiation', 'error');
                setTimeout(() => navigateTo('products.html'), 1000);
                return;
            }

            document.getElementById('productName').textContent = productName || 'Product';
            document.getElementById('originalPrice').textContent = `₹${parseInt(originalPrice || 0).toLocaleString()}`;
            document.getElementById('currentPrice').textContent = `₹${parseInt(originalPrice || 0).toLocaleString()}`;
            
            // Set max proposed price to original price
            document.getElementById('proposedPrice').max = parseInt(originalPrice || 0);

            // Load existing negotiation if any
            loadNegotiationHistory();
        }

        async function loadNegotiationHistory() {
            try {
                // ADJUST ACCORDING TO ACTUAL BACKEND ENDPOINT
                // This would fetch existing negotiations for the product
                // const negotiation = await apiRequest(`/api/negotiations/product/${productId}`);
                
                // For now, show empty form
                showPriceProposalForm();
            } catch (error) {
                console.error('Error loading negotiation history:', error);
                showPriceProposalForm();
            }
        }

        async function submitProposal() {
            const proposedPrice = document.getElementById('proposedPrice').value;
            const message = document.getElementById('message').value;

            if (!proposedPrice) {
                showToast('Please enter a proposed price', 'error');
                return;
            }

            if (parseInt(proposedPrice) <= 0) {
                showToast('Proposed price must be greater than 0', 'error');
                return;
            }

            try {
                // ADJUST ACCORDING TO ACTUAL BACKEND ENDPOINT
                const response = await apiRequest('/api/negotiations/create', {
                    method: 'POST',
                    body: JSON.stringify({
                        productId: productId,
                        proposedPrice: parseInt(proposedPrice),
                        message: message
                    })
                });

                // ADJUST ACCORDING TO ACTUAL BACKEND RESPONSE
                // Expected: { negotiationId, status, message }

                if (response.negotiationId) {
                    currentNegotiationId = response.negotiationId;
                    showToast('Proposal submitted! Waiting for seller response...', 'success');
                    
                    document.getElementById('currentPrice').textContent = `₹${parseInt(proposedPrice).toLocaleString()}`;
                    
                    // Clear form
                    document.getElementById('proposedPrice').value = '';
                    document.getElementById('message').value = '';
                    
                    // Show status
                    showNegotiationStatus();
                    
                    // Optionally reload negotiation after a delay
                    setTimeout(() => loadNegotiationHistory(), 2000);
                }
            } catch (error) {
                console.error('Error submitting proposal:', error);
                showToast(error.message || 'Failed to submit proposal', 'error');
            }
        }

        function acceptOffer() {
            if (!currentNegotiationId) {
                showToast('No active offer to accept', 'error');
                return;
            }

            // Proceed to add to cart with negotiated price
            const cart = getCart();
            const negotiatedPrice = parseInt(document.getElementById('currentPrice').textContent.replace(/₹|,/g, ''));
            
            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += 1;
                existingItem.price = negotiatedPrice;
            } else {
                cart.push({
                    id: productId,
                    quantity: 1,
                    price: negotiatedPrice
                });
            }

            saveCart(cart);
            showToast('Added to cart with negotiated price!', 'success');
            setTimeout(() => navigateTo('cart.html'), 1500);
        }

        function continueNegotiating() {
            document.getElementById('priceProposalForm').style.display = 'block';
            document.getElementById('proposedPrice').value = '';
            document.getElementById('message').value = '';
        }

        function showPriceProposalForm() {
            document.getElementById('priceProposalForm').style.display = 'block';
        }

        function showNegotiationStatus() {
            document.getElementById('negotiationStatus').style.display = 'block';
        }

        function getCart() {
            const cart = localStorage.getItem('cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = totalItems;
                badge.style.display = totalItems > 0 ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
